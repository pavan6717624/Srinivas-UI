<main class="admin-dashboard">
    <section class="dashboard-header">
        <div class="header-copy">
            <span class="eyebrow">OPERATIONS HUB</span>
            <h1>Hi, Admin.</h1>
           </div>
        <!-- <div class="header-mark"><i class="pi pi-compass"></i><span>Admin workspace</span></div> -->
    </section>

    <section class="quick-panel" aria-label="Quick actions">
        <div class="section-intro">
            <div><span class="eyebrow">QUICK ACTIONS</span>
                <!-- <h2>What would you like to manage?</h2> -->
            </div>
            <!-- <span class="section-note"><i class="pi pi-shield"></i> Secure workspace</span> -->
        </div>

        <div class="action-grid">
            <button type="button" class="action-card calendar-card" (click)="goRouter('calendar')">
                <span class="action-icon"><i class="pi pi-calendar"></i></span>
                <span class="action-content"><strong>Calendar</strong><small>Review schedules and upcoming activity</small></span>
                <i class="pi pi-arrow-up-right action-arrow"></i>
            </button>
            <button type="button" class="action-card location-card" (click)="messageService.clear();confirmationService.close();locationVisible=true">
                <span class="action-icon"><i class="pi pi-map-marker"></i></span>
                <span class="action-content"><strong>Locations</strong><small>Maintain pickup and destination points</small></span>
                <i class="pi pi-arrow-up-right action-arrow"></i>
            </button>
            <button type="button" class="action-card trip-card" (click)="messageService.clear();confirmationService.close();tripVisible=true">
                <span class="action-icon"><i class="pi pi-directions"></i></span>
                <span class="action-content"><strong>Trips</strong><small>Plan and coordinate the journey flow</small></span>
                <i class="pi pi-arrow-up-right action-arrow"></i>
            </button>
            <button type="button" class="action-card customer-card" (click)="messageService.clear();confirmationService.close();customerVisible=true">
                <span class="action-icon"><i class="pi pi-users"></i></span>
                <span class="action-content"><strong>Customers</strong><small>Manage profiles and contact details</small></span>
                <i class="pi pi-arrow-up-right action-arrow"></i>
            </button>
            <button type="button" class="action-card reward-card" [routerLink]="['/home/admin/rewards']">
                <span class="action-icon"><i class="pi pi-sparkles"></i></span>
                <span class="action-content"><strong>Rewards</strong><small>Allocate or redeem customer rewards</small></span>
                <i class="pi pi-arrow-up-right action-arrow"></i>
            </button>
        </div>
    </section>

    <!-- <section class="workflow-strip">
        <div class="workflow-icon"><i class="pi pi-compass"></i></div>
        <div><span class="eyebrow">YOUR WORKFLOW</span><strong>Plan <i class="pi pi-angle-right"></i> Schedule <i class="pi pi-angle-right"></i> Support</strong></div>
        <span class="workflow-copy">Use the tools above to keep every part of the operation connected.</span>
    </section> -->
</main>

<p-dialog [modal]="true" header="Location Details" [(visible)]="locationVisible" [style]="{'width':'500px'}">
    <app-trip></app-trip>
</p-dialog>

<p-dialog [modal]="true" header="Trip Details" [(visible)]="tripVisible" [style]="{'width':'500px'}">
    <app-schedule></app-schedule>
</p-dialog>

<p-dialog [modal]="true" header="Customer Details" [(visible)]="customerVisible" [style]="{'width':'500px'}">
    <app-customer></app-customer>
</p-dialog>
